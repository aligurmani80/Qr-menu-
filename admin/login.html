<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF5A00">
  <title>QR Menu — Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top center, #1E1E26 0%, #09090B 70%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }

    .login-glow {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 120px;
      background: var(--primary);
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #FF5A00 0%, #FF8533 100%);
      border-radius: var(--radius-lg);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--primary-glow);
      color: #FFF;
      font-size: 26px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: #FFF;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-dim);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .error-alert {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 8px;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .remember-check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-glow"></div>
    
    <div class="login-brand">
      <div class="login-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </div>
      <h2 class="login-title">Management Portal</h2>
      <p class="login-subtitle">Sign in to access your restaurant operations</p>
    </div>

    <div id="login-error" class="error-alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="error-message">Wrong username or password</span>
    </div>

    <form id="login-form" class="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="remember-row">
        <label class="remember-check">
          <input type="checkbox" id="remember-me" checked>
          <span>Keep me logged in</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary login-btn">
        <span>Sign In</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Auto-redirect if already logged in
    document.addEventListener("DOMContentLoaded", () => {
      const session = Auth.getSession();
      if (session && session.role) {
        window.location.replace("index.html");
      }
    });

    function handleLoginSubmit(event) {
      event.preventDefault();
      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value;
      const remember = document.getElementById("remember-me").checked;
      const errorBox = document.getElementById("login-error");
      const errorMsg = document.getElementById("error-message");

      const result = Auth.login(usernameInput, passwordInput, remember);
      if (result.success) {
        errorBox.style.display = "none";
        if (result.role === "superadmin") {
          window.location.replace("index.html#super-admin");
        } else {
          window.location.replace("index.html#dashboard");
        }
      } else {
        errorMsg.textContent = result.message || "Wrong username or password";
        errorBox.style.display = "flex";
      }
    }
  </script>
</body>
</html>
