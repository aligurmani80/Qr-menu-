<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Karahi House Demo | QR Menu</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var table = params.get("table");
      if (!/^\d{1,3}$/.test(String(table || "")) || Number(table) < 1) table = "5";
      var target = "../../index.html?restaurant=demo-karahi-house&table=" + encodeURIComponent(table);
      window.location.replace(target);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FFF9F1; color: #0F2E1F; font-family: system-ui, sans-serif; }
    a { color: #E67E22; font-weight: 700; }
  </style>
</head>
<body>
  <p>Opening the Karahi House demo menu… <a href="../../index.html?restaurant=demo-karahi-house&amp;table=5">Open demo menu</a></p>
</body>
</html>
